services:
  postgres:
    image: postgres:16-alpine
    container_name: supplier-mgmt-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supplier_mgmt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d supplier_mgmt']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
